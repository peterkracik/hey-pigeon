[package]
name = "heypigeon-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "UniFFI facade over the Hey Pigeon core for the native iOS shell"

[lib]
name = "heypigeon_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]

[dependencies]
heypigeon-core = { path = "../core" }
heypigeon-adapter-gmail = { path = "../adapter-gmail" }
heypigeon-adapter-sqlite = { path = "../adapter-sqlite" }
heypigeon-adapter-openai = { path = "../adapter-openai" }
heypigeon-adapter-jev = { path = "../adapter-jev" }
heypigeon-adapter-anthropic = { path = "../adapter-anthropic" }
heypigeon-adapter-gemini = { path = "../adapter-gemini" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
uniffi = { version = "0.32", features = ["tokio"] }
# UniFFI's `async_runtime = "tokio"` runs the exported futures inside
# async-compat's runtime, which by default is ONE thread: everything the
# engine spawns, and the wake-up of every network read, queued behind
# whatever that thread was doing (a sync page's database write). Its
# `multi-thread` feature (unified into uniffi's copy of the crate) makes
# that runtime tokio's ordinary worker pool.
async-compat = { version = "0.2.6", features = ["multi-thread"] }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# Only to put a test's database into a state an older build left it in.
rusqlite = { version = "0.37", features = ["bundled"] }
