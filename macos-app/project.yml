# XcodeGen spec — `xcodegen generate` produces HeyPigeonMac.xcodeproj (git-ignored).
# The native Mac app over the shared Rust core: the iOS shell's model, engine,
# AI, intents and feature views (../ios-app/HeyPigeon, compiled for macOS
# behind their platform gates) plus the Mac-only window, menus, sidebar and
# list (HeyPigeonMac/). Same package for the Rust core (its xcframework gets
# a macOS slice from ../ios-app/scripts/build-rust.sh when PLATFORM_NAME is
# macosx, which is what Xcode sets for a Mac build).
name: HeyPigeonMac
options:
  bundleIdPrefix: app.heypigeon
  deploymentTarget:
    # macOS 27: the same SDK floor as the phone (Foundation Models with
    # Private Cloud Compute, the Spotlight search tool, the Mail schema's
    # thread entity), and Liquid Glass with it. The app is installed on the
    # author's Mac, so the floor moves instead of gating every call.
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

packages:
  HeyPigeonCore:
    path: ../ios-app/HeyPigeonCore
  # In-app updates (MacUpdater.swift): the app menu's "Check for Updates…"
  # and the silent background install, fed by the appcast publish-macos
  # writes next to every build. Archive & Export re-signs the framework's
  # helpers with the Developer ID, which is what notarization needs.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: false # build-rust.sh writes into the package dir
    # Required for notarized direct distribution (publish-macos.yml).
    ENABLE_HARDENED_RUNTIME: true
    # YES only together with the Private Cloud Compute entitlement
    # (ios-app/project.yml explains the dance; same key, same Info.plist name).
    HEYPIGEON_PRIVATE_CLOUD_COMPUTE: "NO"

targets:
  HeyPigeon:
    type: application
    platform: macOS
    sources:
      # The shared shell. The two iOS-only app files are replaced by
      # HeyPigeonMac/App; every other file compiles for macOS.
      - path: ../ios-app/HeyPigeon
        name: Shared
        excludes:
          - "App/HeyPigeonApp.swift"
          - "App/AppDelegate.swift"
          - "Resources/**"
      - path: HeyPigeonMac
        excludes:
          - "Resources/Fonts/**"
      # Drop Manrope-*.ttf here for the brand typeface (ATSApplicationFontsPath
      # below); without the files SwiftUI falls back to the system font.
      - path: HeyPigeonMac/Resources/Fonts
        type: folder
        buildPhase: resources
    entitlements:
      path: HeyPigeonMac/HeyPigeon.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Gmail, Drive, OpenAI / Jev with the user's own key, the OAuth consent.
        com.apple.security.network.client: true
        # The composer's Files picker.
        com.apple.security.files.user-selected.read-only: true
        # Shared with the widget and share extensions: the widgets' JSON
        # snapshot and a pending share. Not the database, not the Keychain.
        # The team-id-prefixed form: the published app is signed with
        # Developer ID and carries no provisioning profile (publish-macos),
        # and that is the only form macOS honors without one — a plain
        # "group." name would make macOS 15+ ask the user. Every target reads
        # the resolved name back from its Info.plist (HeyPigeonAppGroup).
        # No push entitlement for the same reason (aps-environment needs a
        # profile): the Mac syncs itself every 30 s, the relay is the phone's.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.app.heypigeon
        # Sparkle's installer helpers: a sandboxed app may talk to the two
        # XPC services inside Sparkle.framework only through this exception
        # (sparkle-project.org/documentation/sandboxing).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    dependencies:
      - package: HeyPigeonCore
      - package: Sparkle
        product: Sparkle
      - target: HeyPigeonWidgets
      - target: HeyPigeonShare
    preBuildScripts:
      - name: Build Rust core (cargo + uniffi, macOS slice)
        script: |
          "$SRCROOT/scripts/build-rust.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        # The product is HeyPigeon.app (the display name has the space): a
        # PRODUCT_NAME with a space breaks the TEST_HOST path XcodeGen
        # derives for the unit tests. The tests `@testable import HeyPigeon`.
        PRODUCT_MODULE_NAME: HeyPigeon
        PRODUCT_BUNDLE_IDENTIFIER: app.heypigeon.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: true
    info:
      path: HeyPigeonMac/Info.plist
      properties:
        CFBundleDisplayName: Hey Pigeon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # The Rust engine reads the Mac's Google OAuth client id from here
        # (HeyPigeonMacApp.makeEngine). An "iOS" type client works for the Mac
        # too; its reversed id is the consent sheet's callback scheme below.
        GoogleMacClientID: $(GOOGLE_MAC_CLIENT_ID)
        HeyPigeonRelayURL: $(HEYPIGEON_RELAY_URL)
        # The App Group as signed (AppGroup.identifier on macOS); empty team
        # prefix in an unsigned CI build, where there is no container anyway.
        HeyPigeonAppGroup: $(TeamIdentifierPrefix)group.app.heypigeon
        HeyPigeonPrivateCloudCompute: $(HEYPIGEON_PRIVATE_CLOUD_COMPUTE)
        # Fonts live in Contents/Resources/Fonts (the folder reference above).
        ATSApplicationFontsPath: Fonts
        # Google's OAuth redirect (the reversed client id as a URL scheme);
        # heypigeon:// for the widgets and the share extension; and mailto:,
        # what macOS hands the default mail app (Shared/DeepLinks.swift turns
        # it into a prefilled composer). All three land in onOpenURL.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.heypigeon.oauth
            CFBundleURLSchemes:
              - $(GOOGLE_MAC_REVERSED_CLIENT_ID)
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.heypigeon.links
            CFBundleURLSchemes:
              - heypigeon
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.heypigeon.mailto
            CFBundleURLSchemes:
              - mailto
        # Spotlight's "Search in App" row continues in the list's search field.
        CoreSpotlightContinuation: true
        # The intent new-mail banners are built from, and the open thread
        # (ThreadView.activityType) for Siri's "this email".
        NSUserActivityTypes:
          - INSendMessageIntent
          - app.heypigeon.thread
        # In-app updates (Sparkle; MacUpdater.swift). The feed is the
        # appcast publish-macos uploads to the mac-latest release with every
        # build of main; the public EdDSA key verifies each download (its
        # private half signs them in CI). Checks are on from the first
        # launch — no permission prompt — once an hour, and a new build
        # installs itself in the background; "Check for Updates…" in the
        # app menu is for the impatient. A build without the key (CI, a
        # checkout without Local.xcconfig) leaves the updater off.
        SUFeedURL: https://github.com/peterkracik/hey-pigeon/releases/download/mac-latest/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600
        # Sandboxed apps install through Sparkle's launcher XPC service; the
        # downloader service is not needed with the network.client entitlement.
        SUEnableInstallerLauncherService: true
    scheme:
      environmentVariables:
        # Set to 1 to run against the in-memory sample inbox (no OAuth, no Rust).
        HEYPIGEON_MOCK: "0"
      testTargets:
        - HeyPigeonTests

  # Widgets (Unread · Next reminder · Need reply) — the phone's, built for
  # the Mac: no Live Activities, no Controls, no Lock Screen families, and
  # Done / Snooze are heypigeon:// links. Reads the App Group snapshot the
  # app writes; never links the Rust core.
  HeyPigeonWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: ../ios-app/HeyPigeonWidgets
        name: Widgets
        excludes:
          - "Controls.swift"
          - "ReminderLiveActivity.swift"
          - "TriageLiveActivity.swift"
      - path: ../ios-app/HeyPigeon/Shared/WidgetShared
        name: WidgetShared
    entitlements:
      path: HeyPigeonMac/HeyPigeonWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.app.heypigeon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heypigeon.mac.widgets
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
    info:
      path: HeyPigeonMac/WidgetsInfo.plist
      properties:
        CFBundleDisplayName: Hey Pigeon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        HeyPigeonAppGroup: $(TeamIdentifierPrefix)group.app.heypigeon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # The share menu's "Hey Pigeon": text, links and files into the App
  # Group, then the app opens on a prefilled composer. Never sends.
  HeyPigeonShare:
    type: app-extension
    platform: macOS
    sources:
      - path: HeyPigeonMacShare
      - path: ../ios-app/HeyPigeonShare/ShareView.swift
        name: SharedShare
      - path: ../ios-app/HeyPigeon/Shared/WidgetShared
        name: WidgetShared
    entitlements:
      path: HeyPigeonMac/HeyPigeonShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)group.app.heypigeon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heypigeon.mac.share
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
    info:
      path: HeyPigeonMac/ShareInfo.plist
      properties:
        CFBundleDisplayName: Hey Pigeon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        HeyPigeonAppGroup: $(TeamIdentifierPrefix)group.app.heypigeon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 2

  # The phone's unit tests (model, intents, entities, presets, snapshot,
  # deep links, triage plan, attachment chips) run on the Mac too, plus the
  # Mac window's own (keyboard map, selection, palette). Over the mock
  # engine: no OAuth, no Rust.
  HeyPigeonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../ios-app/HeyPigeonTests
        name: SharedTests
      - path: HeyPigeonMacTests
    dependencies:
      - target: HeyPigeon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heypigeon.mac.tests
        GENERATE_INFOPLIST_FILE: true
