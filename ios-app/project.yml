# XcodeGen spec — `xcodegen generate` produces HeyPigeon.xcodeproj (git-ignored).
# The project file is generated rather than committed so diffs stay readable.
name: HeyPigeon
options:
  bundleIdPrefix: app.heypigeon
  deploymentTarget:
    # iOS 27: the Siri, Foundation Models and Core Spotlight additions the
    # intelligence features use (docs/ios-intelligence.md "iOS 27") are iOS 27
    # SDK APIs, and the app is only installed on the author's phone, so the
    # floor moves instead of gating every call with #available. Liquid Glass
    # (iOS 26) comes along for free.
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

packages:
  HeyPigeonCore:
    path: HeyPigeonCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: false # build-rust.sh writes into the package dir

targets:
  HeyPigeon:
    type: application
    platform: iOS
    sources:
      - path: HeyPigeon
    # Push Notifications capability (issue #16, optional relay). XcodeGen
    # writes the entitlements file; the App Store export flips
    # aps-environment to production.
    entitlements:
      path: HeyPigeon/HeyPigeon.entitlements
      properties:
        aps-environment: development
        # Communication notifications: new-mail banners lead with the
        # sender's name and avatar (NewMailNotifier.swift).
        com.apple.developer.usernotifications.communication: true
        # Shared with the widget and share extensions: a JSON snapshot for
        # the widgets and a pending share. Not the database, not the Keychain.
        com.apple.security.application-groups:
          - group.app.heypigeon
        # Private Cloud Compute model (AI/ModelProviders.swift,
        # PrivateCloudComputeProvider; docs/ios-intelligence.md "iOS 27").
        # The entitlement is granted per App ID on request (developer.apple.com
        # → Identifiers → app.heypigeon.ios → Capabilities → Private Cloud
        # Compute → request access). Until it is granted the key below must
        # stay commented out (a profile without it fails the archive) and
        # HEYPIGEON_PRIVATE_CLOUD_COMPUTE below stays NO: the app then never
        # touches the cloud model. Without the entitlement the framework can
        # report the model available and trap on the first request (build 108
        # crashed starting a triage run that way). Once granted, uncomment the
        # key AND set the setting to YES; publish-ios regenerates the App
        # Store profile with sigh on the next run — check the "Fetch App
        # Store provisioning profile" log shows the capability.
        # com.apple.developer.foundation-models.private-cloud-compute: true
        # Default mail app (Settings › Apps › Default Apps › Email; the
        # "mailto" URL type below and Shared/DeepLinks.swift are the other
        # half). A managed entitlement: the Account Holder requests it at
        # developer.apple.com/contact/request/default-mail-client (the app
        # must open mailto: links, send to any address and receive from any
        # sender — it does). Once granted, tick "Default Mail App" on the App
        # ID (developer.apple.com → Identifiers → app.heypigeon.ios →
        # Capabilities) and uncomment the key; publish-ios regenerates the
        # profile with sigh on the next run. Until then it must stay
        # commented out: a profile without it fails the archive.
        # com.apple.developer.mail-client: true
    dependencies:
      - package: HeyPigeonCore
      - target: HeyPigeonWidgets
      - target: HeyPigeonShare
    preBuildScripts:
      - name: Build Rust core (cargo + uniffi)
        script: |
          "$SRCROOT/scripts/build-rust.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heypigeon.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # From Config/Local.xcconfig — see Config/Local.xcconfig.example
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        # CI's manual signing passes one profile per target (publish-ios.yml);
        # empty under automatic signing.
        PROVISIONING_PROFILE_SPECIFIER: $(PROFILE_APP)
        # YES only together with the Private Cloud Compute entitlement above
        # (Info.plist HeyPigeonPrivateCloudCompute, ModelProviders.swift).
        HEYPIGEON_PRIVATE_CLOUD_COMPUTE: "NO"
    info:
      path: HeyPigeon/Info.plist
      properties:
        CFBundleDisplayName: Hey Pigeon
        # XcodeGen writes literal 1.0 / 1 here unless told otherwise, which
        # ignores the MARKETING_VERSION / CURRENT_PROJECT_VERSION the publish
        # workflow passes — and App Store Connect then rejects the second
        # upload as a duplicate 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The Rust engine reads the iOS OAuth client id from here (HeyPigeonApp.swift).
        GoogleIOSClientID: $(GOOGLE_IOS_CLIENT_ID)
        # Default relay URL for Settings → Notifications (PushController.swift); may be empty.
        HeyPigeonRelayURL: $(HEYPIGEON_RELAY_URL)
        # Whether this build carries the Private Cloud Compute entitlement
        # (PrivateCloudComputeProvider.isEnabledInBuild).
        HeyPigeonPrivateCloudCompute: $(HEYPIGEON_PRIVATE_CLOUD_COMPUTE)
        # Google's iOS OAuth redirect: the reversed client id as a URL scheme;
        # heypigeon:// for widgets, the Live Activity and the share extension;
        # and mailto: — what the system hands the default mail app when a
        # mail link is tapped anywhere (Shared/DeepLinks.swift turns it into
        # a prefilled composer). All three land in HeyPigeonApp.onOpenURL.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.heypigeon.oauth
            CFBundleURLSchemes:
              - $(GOOGLE_IOS_REVERSED_CLIENT_ID)
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.heypigeon.links
            CFBundleURLSchemes:
              - heypigeon
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.heypigeon.mailto
            CFBundleURLSchemes:
              - mailto
        # Spotlight's "Search in App" row: a query typed in Spotlight or asked
        # of Siri continues in the Search tab (CSQueryContinuationActionType,
        # HeyPigeonApp.onContinueUserActivity).
        CoreSpotlightContinuation: true
        # The due-reminder Live Activity (ReminderLiveActivityController).
        NSSupportsLiveActivities: true
        # The intent new-mail banners are built from (communication
        # notifications), and the open thread (ThreadView.activityType) that
        # Siri's on-screen awareness resolves "this email" against.
        NSUserActivityTypes:
          - INSendMessageIntent
          - app.heypigeon.thread
        UIBackgroundModes:
          - fetch
          - remote-notification # silent push from the optional relay
        BGTaskSchedulerPermittedIdentifiers:
          - app.heypigeon.refresh
        # Drop Manrope-*.ttf into HeyPigeon/Resources/Fonts to get the brand
        # typeface; without the files SwiftUI falls back to the system font.
        UIAppFonts:
          - Manrope-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
        # Only HTTPS (exempt). Without this every TestFlight build waits on a
        # manual "Missing Compliance" answer in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # With a custom Info.plist the INFOPLIST_KEY_* build settings are not
        # merged in, so the launch screen, orientations and icon name go here.
        # App Store Connect rejects the upload without them (90475, 90474, 90713).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      environmentVariables:
        # Set to 1 to run against the in-memory sample inbox (no OAuth, no Rust).
        HEYPIGEON_MOCK: "0"
      testTargets:
        - HeyPigeonTests

  # Widgets (Unread · Next reminder · Need reply), the reminder Live
  # Activity and the Controls. Reads the App Group snapshot the app writes;
  # never links the Rust core. Shared/WidgetShared is compiled into both.
  HeyPigeonWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HeyPigeonWidgets
      - path: HeyPigeon/Shared/WidgetShared
    entitlements:
      path: HeyPigeonWidgets/HeyPigeonWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.heypigeon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heypigeon.ios.widgets
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: $(PROFILE_WIDGETS)
        SKIP_INSTALL: true
    info:
      path: HeyPigeonWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hey Pigeon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # The share sheet's "Hey Pigeon": text, links and files into the App
  # Group, then the app opens on a prefilled composer. Never sends.
  HeyPigeonShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HeyPigeonShare
      - path: HeyPigeon/Shared/WidgetShared
    entitlements:
      path: HeyPigeonShare/HeyPigeonShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.heypigeon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heypigeon.ios.share
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: $(PROFILE_SHARE)
        SKIP_INSTALL: true
    info:
      path: HeyPigeonShare/Info.plist
      properties:
        CFBundleDisplayName: Hey Pigeon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 2

  # Unit tests over the mock engine: the intents' perform bodies, the
  # entities and the reminder presets. No OAuth, no Rust, no device.
  HeyPigeonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeyPigeonTests
    dependencies:
      - target: HeyPigeon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heypigeon.ios.tests
        GENERATE_INFOPLIST_FILE: true
