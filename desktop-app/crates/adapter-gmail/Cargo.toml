[package]
name = "heypigeon-adapter-gmail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
heypigeon-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
# http2: one connection carries a sync page's parallel thread fetches
# (HTTP/1.1 opened ten). gzip: Gmail's JSON shrinks about five to one.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
futures = "0.3"
# The body of an upload, shared between a try and its retry without a copy.
bytes = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
