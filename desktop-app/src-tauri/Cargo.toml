[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
heypigeon-core = { path = "../crates/core" }
heypigeon-adapter-gmail = { path = "../crates/adapter-gmail" }
heypigeon-adapter-sqlite = { path = "../crates/adapter-sqlite" }
heypigeon-adapter-openai = { path = "../crates/adapter-openai" }
heypigeon-adapter-jev = { path = "../crates/adapter-jev" }
tokio = { version = "1", features = ["sync", "time"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# tauri-plugin-notification's macOS backend uses the deprecated NSUserNotification
# API, which shows no app icon on modern macOS. Reminder notifications go through
# UNUserNotificationCenter directly instead - see mail.rs::send_reminder_notification.
[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3"
