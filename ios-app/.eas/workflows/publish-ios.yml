# EAS Workflow: build on Expo's macOS workers, then submit to App Store
# Connect / TestFlight. Fires on `ios-v*` tags once the GitHub repo is
# connected to the EAS project (expo.dev → project → GitHub), or by hand:
#   eas workflow:run publish-ios.yml
name: Publish iOS to TestFlight

on:
  push:
    tags:
      - "ios-v*"

jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
