name: deploy-relay

# The iOS push relay (relay/) and its Google Cloud resources (terraform/).
# Pull requests: relay tests + terraform fmt/validate/plan, plan posted as a
# comment. Pushes to main: terraform apply, which also ships the function
# code (the zip hash is part of the source object name).
#
# Auth is Workload Identity Federation (terraform/bootstrap/wif.tf): the
# workflow's OIDC token is exchanged for the relay-deployer service account,
# no key file. Repository variables (not secrets — none of these are):
#   GCP_PROJECT_ID, TF_STATE_BUCKET, GCP_WORKLOAD_IDENTITY_PROVIDER,
#   GCP_DEPLOYER_SA, APNS_KEY_ID, APNS_TEAM_ID, HEYPIGEON_IOS_OAUTH_CLIENT_ID
# Setup: terraform/README.md.

on:
  push:
    branches: [main]
    paths: ["relay/**", "terraform/**", ".github/workflows/deploy-relay.yml"]
  pull_request:
    paths: ["relay/**", "terraform/**", ".github/workflows/deploy-relay.yml"]

concurrency:
  group: terraform-relay
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  relay-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm test

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: relay-test
    # Fork PRs have no OIDC identity for this project; they still get the
    # format/validate checks below via the `if` on the auth steps.
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_apns_key_id: ${{ vars.APNS_KEY_ID }}
      TF_VAR_apns_team_id: ${{ vars.APNS_TEAM_ID }}
      TF_VAR_google_client_ids: '["${{ vars.HEYPIGEON_IOS_OAUTH_CLIENT_ID }}"]'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate (no backend, no credentials)
        run: |
          terraform init -backend=false
          terraform validate
          terraform -chdir=bootstrap init -backend=false
          terraform -chdir=bootstrap validate

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Init (GCS backend)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=relay"

      - name: Plan
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -lock-timeout=120s -out=tfplan 2>&1 | tee plan.txt
          echo "lines=$(wc -l < plan.txt)" >> "$GITHUB_OUTPUT"

      - name: Comment plan on the PR
        if: steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n… (truncated)';
            const marker = '<!-- terraform-relay-plan -->';
            const body = `${marker}\n### Terraform plan (relay)\n\n<details><summary>${process.env.PLAN_LINES} lines</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = comments.data.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          PLAN_LINES: ${{ steps.plan.outputs.lines }}

      - name: Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -lock-timeout=120s
