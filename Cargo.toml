[workspace]
resolver = "2"
members = ["crates/core", "crates/adapter-gmail", "crates/adapter-sqlite", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
